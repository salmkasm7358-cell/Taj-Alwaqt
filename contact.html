<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>اتصل بنا</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/components.css">
</head>
<body>
    <div class="page-header container" style="margin-top:50px;"><h1>اتصل بنا</h1></div>
    <div class="contact-container container">
        <div class="contact-info">
            <p><i class="fa-solid fa-phone text-gold"></i> +966500000000</p>
            <p><i class="fa-solid fa-envelope text-gold"></i> info@taj.com</p>
        </div>
        <form class="contact-form">
            <input type="text" placeholder="الاسم" required>
            <input type="email" placeholder="البريد الإلكتروني" required>
            <textarea rows="5" placeholder="رسالتك..."></textarea>
            <button type="submit" class="btn-gold">إرسال</button>
        </form>
    </div>
    <script src="js/validation.js"></script>
</body>
</html>
