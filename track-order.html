<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تتبع الطلب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/components.css">
</head>
<body>
    <div class="page-header container" style="margin-top:50px;"><h1>تتبع طلبك</h1></div>
    <div class="track-container container">
        <div class="track-search"><input type="text" placeholder="أدخل رقم الطلب"><button class="btn-gold">بحث</button></div>
        <div class="track-status">
            <h3>حالة الطلب</h3>
            <div class="timeline">
                <div class="step active"><i class="fa-solid fa-cart-shopping"></i><p>تم الاستلام</p></div>
                <div class="step active"><i class="fa-solid fa-box"></i><p>قيد التجهيز</p></div>
                <div class="step"><i class="fa-solid fa-truck"></i><p>تم الشحن</p></div>
            </div>
        </div>
    </div>
</body>
</html>
